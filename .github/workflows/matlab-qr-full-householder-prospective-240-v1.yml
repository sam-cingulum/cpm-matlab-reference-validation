name: "Genuine MATLAB R2026b | sealed Rust FULL two-column QR in-place A/tau prospective 240-case oracle"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  prospective-rust-vendor-tree8:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check original predictor input is pinned after frozen private Rust predictions
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/qr_vendor_fullqr_prospective_240_v1/input.json
          test "$(sha256sum "$p" | cut -d' ' -f1)" = 58bd102b473b28a4d3d276f781fd55e7d5b5e36c4f220a71a18e4c71b534e139
          echo 'PRE_ORACLE_PRIVATE_RUST_FORECAST_COMMIT=7fc016eb02f9841b6de1367ac07a8f9132b5a6fc'
          echo 'PRE_ORACLE_RUST_FORECAST_SHA256=ce697fce0d4fe9a7e96d2ce8d87cedabfebc5729971e14fc2fd186b339b4fc64'
          python3 - <<'PY'
          import json,hashlib
          p='Cingulum_Yale_MATLAB_Online/qr_vendor_fullqr_prospective_240_v1/input.json'
          d=json.load(open(p));assert len(d['cases'])==240
          assert len(set((c['id'],c['n']) for c in d['cases']))==240
          assert {c['n'] for c in d['cases']}==set(d['lengths']) and len(d['lengths'])==30
          assert all(len(c['x_hex'])==len(c['y_hex'])==c['n'] and all(len(z)==16 for z in c['x_hex']+c['y_hex']) for c in d['cases'])
          print('ORIGINAL_SOURCE_NOT_YET_RUN: frozen independent Rust SHA recorded, 240 hex-exact raw inputs')
          PY
      - name: Build original MATLAB ABI recorder for all 40 lengths
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation
          gcc -D_FORTIFY_SOURCE=2 -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC "$p/qr_interpose_buffers_320_v1.c" -o "$p/qr_interpose_buffers_320_v1.so" -ldl
          sha256sum "$p/qr_interpose_buffers_320_v1.c" "$p/qr_interpose_buffers_320_v1.so" > "$p/qr_fullqr_240_build_sha256.txt"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Archive original MATLAB and vendor MKL SHA256 and CPU fingerprint
        shell: bash
        run: |
          p=Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation
          { echo "run=$GITHUB_RUN_ID";echo "public_commit=$GITHUB_SHA"; echo 'sealed_private_commit=7fc016eb02f9841b6de1367ac07a8f9132b5a6fc';lscpu;uname -a;for n in MATLAB libmwlapack.so mkl.so;do f=$(find /opt/hostedtoolcache/MATLAB -name "$n" -type f -print -quit);if [ -n "$f" ];then sha256sum "$f";fi;done; } > "$p/qr_fullqr_240_cpu_and_vendor_fingerprint.txt"
      - name: A. Run unchanged MATLAB R2026b public QR and original robustfit three times
        uses: matlab-actions/run-command@v3
        env:
          QR_UNSEEN_240_OUTPUT: qr_fullqr_240_clean.json
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online');
            addpath('native_qr_retro_same_runner_v1/runtime_instrumentation');
            maxNumCompThreads(1);
            qr_fullqr_prospective_240_v1;
      - name: B. Run identical unchanged MATLAB source with genuine QR input/output and tau capture
        id: captured
        continue-on-error: true
        uses: matlab-actions/run-command@v3
        env:
          QR_UNSEEN_240_OUTPUT: qr_fullqr_240_captured.json
          LD_PRELOAD: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_interpose_buffers_320_v1.so
          QR_CAPTURE_LOG: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_private_buffers.log
          QR_INTERPOSE_LOG: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_calls.log
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online');
            addpath('native_qr_retro_same_runner_v1/runtime_instrumentation');
            maxNumCompThreads(1);
            qr_fullqr_prospective_240_v1;
      - name: Strict full original R/h noninterference, raw input and captured Householder stability gate
        if: always()
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.captured.outcome }}
        run: |
          python3 Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/verify_qr_fullqr_prospective_240_v1.py
      - name: Preserve untouched original MATLAB source-unseen oracle for post-freeze private Rust scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-matlab-r2026b-native-full-qr-240-source-unseen-v1
          path: |
            Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_*.json
            Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_*.log
            Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_cpu_and_vendor_fingerprint.txt
            Cingulum_Yale_MATLAB_Online/native_qr_retro_same_runner_v1/runtime_instrumentation/qr_fullqr_240_build_sha256.txt
          retention-days: 90
          if-no-files-found: warn
