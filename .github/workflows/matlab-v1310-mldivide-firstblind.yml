name: MATLAB R2026b V1310 original-only mldivide firstblind
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
          - os: ubuntu-24.04
            cbwr: COMPATIBLE
          - os: ubuntu-22.04
            cbwr: DEFAULT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set the CBWR mode under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cbwr }}" != "DEFAULT" ]; then echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"; fi
      - name: Enforce the preregistered input, script and frozen forecast commitment
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind
          echo "135f3e6e05e1ee2091ce6d1c81f0fbca3ab7cf614483c38dede6a180ccc1786d  $d/input.bin" | sha256sum -c -
          echo "9029a90734068b1abef10a38a841198c0eccdb41cb3f3ff18499577a4544cc53  $d/run_v1310.m" | sha256sum -c -
          test -s "$d/frozen_forecast_commitment.txt"
          grep -Eq '^forecast_sha256 [0-9a-f]{64}$' "$d/frozen_forecast_commitment.txt"
          grep -Eq '^private_freeze_commit [0-9a-f]{40}$' "$d/frozen_forecast_commitment.txt"
          # original-only: no forecast values, MEX source or Rust output may be present
          test "$(ls "$d" | sort | tr '\n' ' ')" = "frozen_forecast_commitment.txt input.bin run_v1310.m "
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1310.m" "$d/input.bin" "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          cat "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V1310 firstblind rejected unapproved CPU $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
      - name: Run two original MATLAB R2026b Update 1 repetitions
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind'); run_v1310
      - name: Record input custody in the provenance and write the manifest
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind
          python3 - "$d" <<'PY'
          import hashlib, json, sys
          d = sys.argv[1]
          p = json.load(open(f"{d}/out/provenance.json"))
          assert p["classification"] == "V1310_ORIGINAL_ONLY_MLDIVIDE_FIRSTBLIND" and p["forecast_read"] is False
          p["input_sha256"] = hashlib.sha256(open(f"{d}/input.bin", "rb").read()).hexdigest()
          p["script_sha256"] = hashlib.sha256(open(f"{d}/run_v1310.m", "rb").read()).hexdigest()
          hidden = open(f"{d}/out/hidden.bin", "rb").read()
          assert hidden == open(f"{d}/out/hidden_repeat.bin", "rb").read(), "the two repetitions differ"
          assert len(hidden) == 8 * p["words"]
          json.dump(p, open(f"{d}/out/provenance.json", "w"))
          PY
          cd "$d/out"
          sha256sum hidden.bin hidden_repeat.bin hidden_ranks.csv provenance.json original_cpu.txt > original_sha256_manifest.txt
          cat original_sha256_manifest.txt
      - name: Preserve original evidence and rejected CPU diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-v1310-r2026b-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/mldivide_v1310_firstblind/out
          if-no-files-found: warn
          retention-days: 90
