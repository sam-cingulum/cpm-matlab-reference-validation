name: "MATLAB R2026b V1428 positive-real gammaln holdout"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
          - os: ubuntu-24.04
            cbwr: COMPATIBLE
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set CBWR mode
        shell: bash
        run: |
          set -euo pipefail
          echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"
      - name: Reject CPUs outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/gammaln_v1428
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1428.m" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC (7763|9V45)( [A-Za-z0-9-]+)*$'; then
            echo "V1428 rejected unapproved CPU $model" >&2
            exit 86
          fi
      - name: Regenerate and verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/gammaln_v1428
          python3 "$d/make_inputs.py" "$d/input"
          (cd "$d/input" && sha256sum -c ../input_sha256.txt)
          cp "$d/input_sha256.txt" "$d/out/input_sha256.txt"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/gammaln_v1428
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
      - name: Verify launch environment
        shell: bash
        run: |
          set -euo pipefail
          test "$MKL_NUM_THREADS" = 1
          test "$OMP_NUM_THREADS" = 1
          test "$MKL_CBWR" = COMPATIBLE
          d=Cingulum_Yale_MATLAB_Online/gammaln_v1428
          printf 'MKL_NUM_THREADS=%s\nOMP_NUM_THREADS=%s\nMKL_CBWR=%s\nMATLAB_STARTUP_OPTIONS=-singleCompThread\n' "$MKL_NUM_THREADS" "$OMP_NUM_THREADS" "$MKL_CBWR" >> "$d/out/original_cpu.txt"
      - name: Execute two original MATLAB repetitions
        uses: matlab-actions/run-command@v3
        with:
          startup-options: -singleCompThread
          command: cd('Cingulum_Yale_MATLAB_Online/gammaln_v1428'); run_v1428
      - name: Compare repetitions and write manifest
        shell: bash
        run: |
          set -euo pipefail
          cd Cingulum_Yale_MATLAB_Online/gammaln_v1428/out
          for suffix in words:bin status:tsv; do
            stem="${suffix%:*}"
            ext="${suffix#*:}"
            cmp "${stem}_1.${ext}" "${stem}_2.${ext}"
          done
          sha256sum * > ../sha256_manifest.txt
          mv ../sha256_manifest.txt .
      - name: Preserve original evidence and rejected CPU diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1428-gammaln-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/gammaln_v1428/out
          if-no-files-found: warn
          retention-days: 90
