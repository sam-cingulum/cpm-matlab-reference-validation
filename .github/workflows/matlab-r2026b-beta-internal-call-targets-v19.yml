name: "Genuine R2026b | beta public ELF symbol identity of unresolved libm target v19"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-beta-call-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate and compile only independent user-authored research probe
        shell: bash
        run: |
          set -euo pipefail
          root=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          python3 -m py_compile "$root/resolve_beta_numeric_helpers_v19.gdb.py"
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -fno-fast-math \
            "$root/resolve_original_mathspec_helper_v11.cpp" \
            -o /tmp/original_r2026b_beta_public_helpers_v19 -ldl
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gdb
          fi
          sha256sum "$root/resolve_beta_numeric_helpers_v19.gdb.py" "$root/resolve_original_mathspec_helper_v11.cpp"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: SHA-pin original R2026b; inspect only public math helper identity with vendor code redacted
        shell: bash
        run: |
          set -euo pipefail
          root=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          lib=$(find /opt/hostedtoolcache/MATLAB -type f -path '*/bin/glnxa64/libmwmathspec.so' -print -quit)
          test -n "$lib"
          test "$(sha256sum "$lib" | cut -d' ' -f1)" = "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848"
          sym=$(nm -D --defined-only "$lib" | awk '$3=="_ZN8mathspec7gammalnEd" {print $3}')
          test "$sym" = "_ZN8mathspec7gammalnEd"
          export LD_LIBRARY_PATH="$(dirname "$lib"):${LD_LIBRARY_PATH:-}"
          export CINGULUM_BETA_CALL_TARGET_OUTPUT=original_mathspec_beta_public_helpers_v19.json
          if ! timeout 900 gdb -nx --batch -q \
              -x "$root/resolve_beta_numeric_helpers_v19.gdb.py" \
              --args /tmp/original_r2026b_beta_public_helpers_v19 "$lib" "$sym" 0x632e0 \
              >/tmp/cingulum_gdb_beta_helpers_v19_private.log 2>&1; then
            echo "FAIL_ORIGINAL_BETA_CALL_TARGET_RESEARCH_PRIVATE_VENDOR_LOG_SUPPRESSED"
            rm -f /tmp/cingulum_gdb_beta_helpers_v19_private.log
            exit 1
          fi
          rm -f /tmp/cingulum_gdb_beta_helpers_v19_private.log
          python3 - <<'PY'
          import json,hashlib
          p=json.load(open('original_mathspec_beta_public_helpers_v19.json'))
          assert p['original_libmwmathspec_sha256']=='625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848'
          assert p['target_count']==10
          assert p['previous_v17_first_instruction_classifier']=='INSUFFICIENT_MISLABELLED_SAFE_MOV_LOADS_AS_OTHER'
          targets={x['original_direct_call_target_offset']:x for x in p['sanitized_call_target_classification']}
          assert targets['0x632e0']['destination_library_category']=='system_libm'
          assert targets['0x632e0']['public_standard_symbol']=='log'
          assert targets['0x632e0']['exact_public_ELF_libm_symbol'] in ('log','unresolved_optimized_entry')
          assert targets['0x632d0']['destination_library_category']=='system_libm'
          assert len(p['sanitized_call_target_classification'])==10
          assert not p['vendor_instructions_bytes_constants_register_contents_or_original_outputs_distributed']
          assert p['independent_pure_Rust_betainc_lower_upper_bit_parity']=='NOT_CERTIFIED'
          assert p['source_unseen_V12']=='NOT_GENERATED'
          print('BETA_ORIGINAL_STRUCTURAL_CALL_TARGET_COUNT',p['target_count'])
          print('OUTPUT_SHA256',hashlib.sha256(open('original_mathspec_beta_public_helpers_v19.json','rb').read()).hexdigest())
          PY
      - name: Publish user-authored public-function metadata only
        uses: actions/upload-artifact@v4
        with:
          name: genuine-R2026b-beta-hidden-call-targets-v19-public-metadata
          path: original_mathspec_beta_public_helpers_v19.json
          retention-days: 90
          if-no-files-found: error
