name: R2026b unchanged fixed-penalty two-measure ridgeCPM_PCA V90
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  numeric-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/ridge_pca_fixed_v90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sha256sum -c input.sha256
          lscpu > cpu.txt
          head -n 20 cpu.txt
          grep -E '^Model name: *AMD EPYC .*(7763|9V45)' cpu.txt
      - name: Check out the pinned original Yale source
        run: |
          git clone --quiet https://github.com/YaleMRRC/CPM.git upstream
          git -C upstream checkout --quiet --detach b903f83b476b745417b1f062f6777f5ffe118f1a
          test "$(git -C upstream rev-parse HEAD)" = b903f83b476b745417b1f062f6777f5ffe118f1a
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox Bioinformatics_Toolbox
      - run: |
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/ridge_pca_fixed_v90'); run_pca_ridge
      - uses: actions/upload-artifact@v4
        with:
          name: ridge-pca-fixed-v90
          path: |
            Cingulum_Yale_MATLAB_Online/ridge_pca_fixed_v90/original.json
            Cingulum_Yale_MATLAB_Online/ridge_pca_fixed_v90/cpu.txt
          if-no-files-found: error
