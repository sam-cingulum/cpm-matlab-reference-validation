name: R2026b original scalar gamma public ABI and host math controls V130
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  numeric-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/gamma_abi_v130
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp ../gamma_shape_one_v127/{input.json,input.sha256} .
          sha256sum -c input.sha256
          lscpu > cpu.txt
          head -n 20 cpu.txt
          grep -E '^Model name: *AMD EPYC .*(7763|9V45)' cpu.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - run: |
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
      - name: Compare installed original ABI and public host math
        run: |
          g++ -std=c++20 -O2 -fno-builtin -Wall -Werror gamma_reference.cpp -ldl -o /tmp/cpm-gamma-v130
          lib=$(find /opt/hostedtoolcache/MATLAB -type f -path '*/bin/glnxa64/libmwmathspec.so' -print -quit)
          export LD_LIBRARY_PATH="$(dirname "$lib"):${LD_LIBRARY_PATH:-}"
          python3 run_probe.py "$lib"
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/gamma_abi_v130'); addpath('../gamma_shape_one_v127'); run_gamma
      - uses: actions/upload-artifact@v4
        with:
          name: gamma-abi-v130
          path: |
            Cingulum_Yale_MATLAB_Online/gamma_abi_v130/original.json
            Cingulum_Yale_MATLAB_Online/gamma_abi_v130/abi.json
            Cingulum_Yale_MATLAB_Online/gamma_abi_v130/cpu.txt
          if-no-files-found: error
