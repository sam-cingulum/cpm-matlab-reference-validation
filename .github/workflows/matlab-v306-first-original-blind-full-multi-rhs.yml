name: Genuine MATLAB V306 FIRST ORIGINAL BLIND full-length MULTI-RHS numerical bit parity
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable new V306 original-only synthetic raw matrix input
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue
          echo "0afa148cee5a966cac05c3678f10c43a83bf4adc6daa519a2b9343a43736f285  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue/input.json'
          d=json.load(open(p))
          assert d['classification']=='V306_NEW_SOURCE_UNSEEN_GENUINE_MATLAB_FULL_LENGTH_MULTI_RHS_MLDIVIDE'
          assert d['seed']==202611220306 and d['cohorts']==48 and len(d['cases'])==48
          assert d['max_RHS_columns']==16
          assert d['source_MATLAB_numerical_results_consulted'] is False
          assert d['Rust_binary64_forecast_supplied_to_original'] is False
          assert d['first_original_blind_certificate_candidate'] is True
          assert d['historical_V252_first_blind_full17']=='FAIL'
          assert d['historical_V263_first_blind_reduced']=='PASS_216_OF_216'
          assert d['historical_V284_first_blind_full_length_single']=='PASS_1770_OF_1770'
          assert d['universal_V12']=='SEALED'
          assert d['padding_counts']==[0,1,7]
          assert d['RHS_matrix_widths']==[1,2,3,4,5,6,7,8,9,12,16]
          assert len(set(c['id'] for c in d['cases']))==48
          assert Counter(x['p'] for x in d['cases'])==dict.fromkeys(range(3,9),8)
          assert Counter(x['family'] for x in d['cases'])==dict.fromkeys(('dense','correlated','cancellation','row_scaled'),12)
          assert all(23<=c['n']<=129 and 3<=c['p']<=8 for c in d['cases'])
          assert all(len(c['a_colmajor_hex'])==c['p']*c['n'] and len(c['rhs16_colmajor_hex'])==16*c['n'] for c in d['cases'])
          print('V306 NEW TRUE SOURCE-UNSEEN FULL MULTI-RHS ORIGINAL CHALLENGE ADMITTED')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue/original_cpu.txt
      - name: Execute genuine original-only MATLAB V306 twice AFTER frozen Rust MULTI-RHS prediction
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue'); run_original_v306
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v306-firstblind-full-multi-48
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue/original.json
            Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v306_firstblind_full_rhs_multivalue/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
