name: Genuine MATLAB V398 NEW first-original-blind public two-reflector Q and R 64 cases
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify NEW unseen original-only X and MATLAB source strictly pinned
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64
          echo "f344051a9d97243835071f2034b6d8eaea7aa589728f8c69efc39869fbc96a52  $p/input.json" | sha256sum -c -
          echo "1141913d97e16580742e2c37ec14607ccbe06be48a48633b7a701b9f8b954e26  $p/run_original_v398.m" | sha256sum -c -
          python3 - <<'PY'
          import json
          d=json.load(open('Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64/input.json'))
          assert d['classification']=='V398_GENUINELY_NEW_FIRST_ORIGINAL_BLIND_TWO_REFLECTOR_Q_CROSS_AMD_64'
          assert d['original_MATLAB_numerical_outputs_seen_before_frozen_native'] is False
          assert d['original_only_source_can_read_Rust_numerical_predictions'] is False
          assert d['new_source_original_unseen_candidate'] is True
          assert d['preoracle_private_Rust_forecast_plus_7_negative_controls_required'] is True
          assert d['seed']==202611230398 and d['case_count']==64 and len(d['cases'])==64
          assert d['p_values']==[9,10,11,12] and d['n_values']==[48,65]
          assert d['zero_paddings']==[0,1,7,16]
          assert d['new_original_Q_first_two_column_bits']==32000
          assert d['historical_V371']=='IMMUTABLE_FAIL_133582_OF_182784'
          assert d['historical_V366']=='PASS_365568_OF_365568' and d['V12']=='SEALED'
          print('V398 genuinely NEW source-original-UNSEEN 32000-Q-bit original-only challenge input/source valid')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64/original_cpu.txt
      - name: Execute genuine original MATLAB V398 new 64-case Q and R original twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64'); run_original_v398
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v398-new-firstblind-Q64
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64/original.json
            Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v398_new_firstblind_two_reflector_Q_64/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
