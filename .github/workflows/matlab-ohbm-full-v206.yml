name: R2026b original OHBM four-option V206 NEW 24x1208 LOO first-blind
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  numeric-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/ohbm_full_v206
    steps:
      - uses: actions/checkout@v4
      - run: |
          sha256sum -c input.sha256
          lscpu > cpu.txt
          head -n 20 cpu.txt
          grep -E '^Model name: *AMD EPYC (7763|9V45)' cpu.txt
      - name: Check out the pinned original Yale source
        run: |
          git clone --quiet https://github.com/YaleMRRC/CPM_OHBM.git upstream
          git -C upstream checkout --quiet --detach 708999b8bb27ae69722775c323da9f14ef6732c7
          test "$(git -C upstream rev-parse HEAD)" = 708999b8bb27ae69722775c323da9f14ef6732c7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - run: |
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/ohbm_full_v206'); addpath('../ohbm_full_v57'); run_ohbm
      - uses: actions/upload-artifact@v4
        with:
          name: ohbm-full-v206
          path: |
            Cingulum_Yale_MATLAB_Online/ohbm_full_v206/original.json
            Cingulum_Yale_MATLAB_Online/ohbm_full_v206/cpu.txt
          if-no-files-found: error
