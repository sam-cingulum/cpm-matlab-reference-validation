name: R2026b complete returned robustfit fields on disclosed V11 inputs V44
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  numeric-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/robustfit_complete_v44
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "1144418910dc6a81ba3b98f9540fe914ac796d9a9bab25ce75f6c1ef2ace2f53  ../matlab_robustfit_end_to_end_source_unseen_480_v11/input.json" | sha256sum -c -
          lscpu > cpu.txt
          head -n 20 cpu.txt
          grep -E '^Model name: *AMD EPYC .*(7763|9V45)' cpu.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - run: |
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/robustfit_complete_v44'); run_full_return
      - uses: actions/upload-artifact@v4
        with:
          name: robustfit-complete-v44
          path: |
            Cingulum_Yale_MATLAB_Online/robustfit_complete_v44/original.json
            Cingulum_Yale_MATLAB_Online/robustfit_complete_v44/cpu.txt
          if-no-files-found: error
