name: MATLAB R2026b V1354 original-only large-row firstblind (X\B and robustfit)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
          - os: ubuntu-24.04
            cbwr: COMPATIBLE
          - os: ubuntu-22.04
            cbwr: DEFAULT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set the CBWR mode under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cbwr }}" != "DEFAULT" ]; then echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"; fi
      - name: Enforce the preregistered inputs, script and frozen forecast commitment
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind
          echo "6bac522b23791307ace0bc9d69c40ce3ec732669b55e0c1a7f6d204f53733fed  $d/input_xb.bin" | sha256sum -c -
          echo "93d0d71df672e9dad53233aedd16ddd40c2bd5fac3f128e9551d7918c8bc4a41  $d/input_rf.bin" | sha256sum -c -
          echo "6823a5c18c535334ca84ca649d02595d252c825303dc2feefe2352f13a6ac035  $d/run_v1354.m" | sha256sum -c -
          c="$d/frozen_forecast_commitment.txt"
          test -s "$c"
          for s in xb rf; do
            for f in forecast forecast_meta forecast_warnings; do
              grep -Eq "^${s}_${f}_sha256 [0-9a-f]{64}$" "$c"
            done
          done
          grep -Eq '^private_freeze_commit [0-9a-f]{40}$' "$c"
          # original-only: no forecast values, MEX source or Rust output may be present
          test "$(ls "$d" | sort | tr '\n' ' ')" = "frozen_forecast_commitment.txt input_rf.bin input_xb.bin run_v1354.m "
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1354.m" "$d/input_xb.bin" "$d/input_rf.bin" "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          cat "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V1354 firstblind rejected unapproved CPU $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
      - name: Run two original MATLAB R2026b Update 1 repetitions of each stratum
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind'); run_v1354
      - name: Record input custody in the provenance and write the manifest
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind
          python3 - "$d" <<'PY'
          import hashlib, json, sys
          d = sys.argv[1]
          p = json.load(open(f"{d}/out/provenance.json"))
          assert p["classification"] == "V1354_ORIGINAL_ONLY_LARGE_ROWS_FIRSTBLIND" and p["forecast_read"] is False
          for s in ("xb", "rf"):
              p[f"input_{s}_sha256"] = hashlib.sha256(open(f"{d}/input_{s}.bin", "rb").read()).hexdigest()
              hidden = open(f"{d}/out/hidden_{s}.bin", "rb").read()
              assert hidden == open(f"{d}/out/hidden_{s}_repeat.bin", "rb").read(), f"the two {s} repetitions differ"
              assert len(hidden) == 8 * p[f"{s}_words"]
          p["script_sha256"] = hashlib.sha256(open(f"{d}/run_v1354.m", "rb").read()).hexdigest()
          json.dump(p, open(f"{d}/out/provenance.json", "w"))
          PY
          cd "$d/out"
          sha256sum hidden_xb.bin hidden_xb_repeat.bin hidden_xb_meta.csv hidden_xb_warnings.tsv \
            hidden_rf.bin hidden_rf_repeat.bin hidden_rf_meta.csv hidden_rf_warnings.tsv \
            provenance.json original_cpu.txt > original_sha256_manifest.txt
          cat original_sha256_manifest.txt
      - name: Preserve original evidence and rejected CPU diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-v1354-r2026b-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/v1354_large_rows_firstblind/out
          if-no-files-found: warn
          retention-days: 90
