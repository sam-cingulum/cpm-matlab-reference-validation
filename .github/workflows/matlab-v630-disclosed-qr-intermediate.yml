name: MATLAB R2026b V630 source-disclosed public QR intermediate
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-only V624 input and V630 original runner
        shell: bash
        run: |
          set -euo pipefail
          src=Cingulum_Yale_MATLAB_Online/multix_v624_firstblind_n65_cross_disagreement_holdout/input.json
          dst=Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage
          echo "77fdca9866b32179c310ee3e2c92982058a34fd4fc8fd29b7a30cfd625d8b18b  $src" | sha256sum -c -
          echo "c9990d48e576e6c3edca435c6ac333dc996ee9d7f2339dd78cd5cffefc2f6640  $dst/run_disclosed_v630.m" | sha256sum -c -
          python3 - <<'PY'
          import json
          p='Cingulum_Yale_MATLAB_Online/multix_v624_firstblind_n65_cross_disagreement_holdout/input.json'
          d=json.load(open(p))
          assert d['source_only'] and d['V12']=='SEALED'
          assert d['classification']=='V624_PROSPECTIVE_R2026B_ORIGINAL_ONLY_NEW_X_B'
          assert not d['original_MATLAB_numerical_outputs_read']
          assert not d['independent_Rust_outputs_read']
          assert d['seed']==202611246203
          assert len(d['matrices'])==8 and len(d['cases'])==96
          PY
      - name: Reject unapproved AMD CPU before MATLAB invocation
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage
          { echo "Original GitHub Run=$GITHUB_RUN_ID"; echo "Public original source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$dst/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V630 genuine original rejected: unapproved CPU $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify exact MathWorks mathspec library
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$dst/original_cpu.txt"
      - name: Run original MathWorks double-repeated public QR stage experiment
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage'); run_disclosed_v630
      - name: Strict source-disclosed provenance and original SHA custody
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage
          test -s "$dst/original_v630.json"
          python3 - <<'PY'
          import json
          p='Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage/original_v630.json'
          d=json.load(open(p))
          assert d['classification']=='V630_R2026B_SOURCE_DISCLOSED_PUBLIC_QR_INTERMEDIATE'
          assert d['V12']=='SEALED' and d['NOT_new_firstblind']
          assert not d['source_original_only_reads_Rust_values']
          assert 'R2026b) Update 1' in d['release']
          assert d['mkl_cbwr']=='COMPATIBLE' and d['repetitions']==2
          assert d['source_V624_input_SHA256']=='77fdca9866b32179c310ee3e2c92982058a34fd4fc8fd29b7a30cfd625d8b18b'
          assert d['widths']==[1,12,13,24,25,32]
          rows=d['rows']
          assert len(rows)==8
          for i in range(4):
              a,b=rows[i].copy(),rows[i+4].copy()
              assert a.pop('rep')==1 and b.pop('rep')==2 and a==b
          assert {(r['p'],r['z']) for r in rows}=={(p,z) for p in [9,10] for z in [2,7]}
          for r in rows:
              assert len(r['q_col0'])==65+r['z']
              assert len(r['q_col1'])==65+r['z']
              assert len(r['r_row0'])==r['p']
              assert len(r['r_row1'])==r['p']
              assert len(r['probes'])==3
              for probe in r['probes']:
                  assert len(probe['layouts'])==2
                  for layout in probe['layouts']:
                      assert layout['layout'] in ['repeated','signed_power2']
                      assert [panel['w'] for panel in layout['panels']]==d['widths']
                      for panel in layout['panels']:
                          assert len(panel['columns'])==panel['w']
          print('V630 genuine original source-disclosed QR stages PASS')
          PY
          sha256sum "$dst/original_v630.json" "$dst/original_cpu.txt" > "$dst/original_sha256_manifest.txt"
      - name: Preserve original results or blocked CPU provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v630-source-disclosed-qr-stage
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage/original_v630.json
            Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v630_disclosed_qr_stage/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
