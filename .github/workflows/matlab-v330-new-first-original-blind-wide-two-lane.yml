name: Genuine MATLAB V330 new first ORIGINAL blind wide p7 p8 two-lane 261120 exact binary64
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable new V330 original-only synthetic raw matrix input
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane
          echo "8baa36c0d3938326011fab566c572754d8791ae8a72987ec36fd2aa2754044b2  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane/input.json'
          d=json.load(open(p))
          assert d['classification']=='V330_NEW_GENUINE_ORIGINAL_FIRST_BLIND_FULL_LENGTH_WIDE_TWO_LANE_MULTI_RHS'
          assert d['seed']==202611220330 and d['cohorts']==64 and len(d['cases'])==64
          assert d['max_RHS_columns']==16
          assert d['source_original_MATLAB_numerical_results_seen'] is False
          assert d['original_mathworks_sees_native_forecast'] is False
          assert d['first_original_blind_certificate_candidate'] is True
          assert d['previous_first_blind_V308']=='IMMUTABLE_FAIL_54741_OF_57816'
          assert d['previous_first_blind_V284_single']=='PASS_1770_OF_1770'
          assert d['V252_full17']=='FAIL'
          assert d['V263_reduced']=='PASS_216_OF_216'
          assert d['V12']=='SEALED'
          assert d['padding_counts']==[0,1,7,16]
          assert d['RHS_matrix_widths']==list(range(1,17))
          assert len(set(c['id'] for c in d['cases']))==64
          assert Counter(c['p'] for c in d['cases'])=={7:32,8:32}
          assert Counter(c['family'] for c in d['cases'])==dict.fromkeys(('dense','correlated','cancellation','row_scaled'),16)
          assert all(19<=c['n']<=137 and c['n']>c['p'] for c in d['cases'])
          assert all(len(c['a_colmajor_hex'])==c['p']*c['n'] and len(c['rhs16_colmajor_hex'])==16*c['n'] for c in d['cases'])
          assert sum(c['p'] for c in d['cases'])*len(d['padding_counts'])*sum(d['RHS_matrix_widths'])==261120
          print('V330 NEW SOURCE-UNSEEN WIDE TWO-LANE FIRST ORIGINAL BLIND ORIGINAL-ONLY INPUT ADMITTED')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane/original_cpu.txt
      - name: Execute genuinely original-only MATLAB V330 twice AFTER PRIVATE forecast and scorer pushed
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane'); run_original_v330
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v330-firstblind-wide-64
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane/original.json
            Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v330_first_original_blind_wide_two_lane/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
