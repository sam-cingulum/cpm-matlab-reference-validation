name: MATLAB R2026b V1394 original-only firstblind (Yale OHBM kfold_cpm_withmatrix and kfold_cpm_partial_withmatrix called the way a caller calls them, to workspace scale)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OHBM_COMMIT: 708999b8bb27ae69722775c323da9f14ef6732c7
jobs:
  original-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
          - os: ubuntu-24.04
            cbwr: COMPATIBLE
          - os: ubuntu-22.04
            cbwr: DEFAULT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Set the CBWR mode under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cbwr }}" != "DEFAULT" ]; then echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"; fi
      - name: Enforce the preregistered inputs, script and frozen forecast commitment
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind
          echo "ef151eaa75964a1eecd383fb0df58a6f84b92d59fef60dc183acc1df12970b9e  $d/cases.csv" | sha256sum -c -
          echo "eb9c3898ca909cdba9be0812c471300ca3b70c1db18f1a2c871cf9c02e50672b  $d/run_v1394.m" | sha256sum -c -
          c="$d/frozen_forecast_commitment.txt"
          echo "8b6311149b5de7cad7a8dcfdd7bf400d6fc2423d4f12841a5c949c928ced6cd2  $c" | sha256sum -c -
          for f in case_list forecast_case_sha256_csv forecast_fields forecast_status forecast_text_sha256_csv; do
            grep -Eq "^${f}_sha256 [0-9a-f]{64}$" "$c"
          done
          grep -Eq '^private_freeze_commit [0-9a-f]{40}$' "$c"
          # original-only: no forecast values, MEX source or Rust output may be present
          test "$(ls "$d" | sort | tr '\n' ' ')" = "cases.csv frozen_forecast_commitment.txt run_v1394.m "
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1394.m" "$d/cases.csv" "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          cat "$d/frozen_forecast_commitment.txt" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V1394 firstblind rejected unapproved CPU $model" >&2
            exit 86
          fi
      - name: Check out the pinned original Yale source (unchanged)
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind
          git clone --quiet https://github.com/YaleMRRC/CPM_OHBM.git "$d/upstream"
          git -C "$d/upstream" checkout --quiet --detach "$OHBM_COMMIT"
          test "$(git -C "$d/upstream" rev-parse HEAD)" = "$OHBM_COMMIT"
          test -z "$(git -C "$d/upstream" status --porcelain)"
          sha256sum "$d"/upstream/*.m >> "$d/out/original_cpu.txt"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
      - name: Run original MATLAB R2026b Update 1 with unchanged Yale code, two repetitions of every case
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind'); run_v1394
      - name: Record input custody in the provenance and write the manifest
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind
          python3 - "$d" <<'PY'
          import hashlib, json, sys
          d = sys.argv[1]
          p = json.load(open(f"{d}/out/provenance.json"))
          assert p["classification"] == "V1394_ORIGINAL_ONLY_OHBM_KFOLD_FIRSTBLIND" and p["forecast_read"] is False
          p["case_list_sha256"] = hashlib.sha256(open(f"{d}/cases.csv", "rb").read()).hexdigest()
          p["script_sha256"] = hashlib.sha256(open(f"{d}/run_v1394.m", "rb").read()).hexdigest()
          json.dump(p, open(f"{d}/out/provenance.json", "w"))
          PY
          cd "$d/out"
          sha256sum kfold*.bin kfold*.csv kfold*.tsv provenance.json original_cpu.txt > original_sha256_manifest.txt
          cat original_sha256_manifest.txt
          for file in kfold.bin kfold_fields.csv kfold_status.tsv kfold_text.tsv; do
            cmp "$file" "${file%.*}_repeat.${file##*.}"
          done
          echo "the two repetitions are byte-identical"
      - name: Preserve original evidence and rejected CPU diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-v1394-r2026b-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/v1394_ohbm_kfold_firstblind/out
          if-no-files-found: warn
          retention-days: 90
