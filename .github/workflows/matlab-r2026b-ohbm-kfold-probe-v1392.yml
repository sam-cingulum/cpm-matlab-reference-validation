name: "MATLAB R2026b V1392 source-disclosed diagnostic (Yale OHBM kfold_cpm_withmatrix and kfold_cpm_partial_withmatrix with every caller argument and data path, to workspace scale)"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OHBM_COMMIT: 708999b8bb27ae69722775c323da9f14ef6732c7
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Set the CBWR mode under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cbwr }}" != "DEFAULT" ]; then echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"; fi
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1392.m" "$d/cases.csv" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V1392 rejected unapproved CPU $model" >&2
            exit 86
          fi
      - name: Check out the pinned original Yale OHBM source
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392
          git clone --quiet https://github.com/YaleMRRC/CPM_OHBM.git "$d/upstream"
          git -C "$d/upstream" checkout --quiet --detach "$OHBM_COMMIT"
          test "$(git -C "$d/upstream" rev-parse HEAD)" = "$OHBM_COMMIT"
          test -z "$(git -C "$d/upstream" status --porcelain)"
          sha256sum "$d"/upstream/*.m >> "$d/out/original_cpu.txt"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
      - name: Run original MATLAB R2026b Update 1, two repetitions of every case
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392'); run_v1392
      - name: Manifest
        if: always()
        shell: bash
        run: |
          cd Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392/out
          ls -la
          grep -c returned kfold_status.tsv || true
          sha256sum * > ../sha256_manifest.txt || true
          mv ../sha256_manifest.txt .
      - name: Preserve original evidence and rejected CPU diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1392-ohbm-kfold-probe-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/ohbm_kfold_probe_v1392/out
          if-no-files-found: warn
          retention-days: 90
