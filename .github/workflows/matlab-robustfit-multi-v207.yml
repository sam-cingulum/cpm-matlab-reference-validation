name: Original MathWorks R2026b V207 raw multipredictor robustfit and independent QR source challenge
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-unchanged-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify preregistered input and frozen Rust preoracle reference
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207
          echo "cf2ce04ce28c9b771554820820e2e4390dd49e2b8914eb7b9797935d634d5719  $p/input.json" | sha256sum -c -
          echo "V207 independent Rust QR/OLS first forecast will be published before dispatch"
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207/input.json'
          d=json.load(open(p))
          assert d['schema']=='CINGULUM_V207_R2026B_RAW_MULTIPREDICTOR_ROBUSTFIT_FIRST_BLIND'
          assert d['seed']==202611220207 and len(d['cases'])==36
          assert len({a['id'] for a in d['cases']})==36
          assert Counter(a['n'] for a in d['cases'])=={31:12,47:12,71:12}
          assert all(len(a['x_colmajor_hex'])==a['n']*a['p'] and len(a['y_hex'])==a['n'] for a in d['cases'])
          print('V207 preregistered input only, no MATLAB numerics accessed')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Runner real CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "UNAPPROVED SOURCE CPU: original MATLAB not executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Exact genuine MathWorks R2026b mathspec runtime fingerprint
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207/original_cpu.txt
      - name: Invoke unchanged original robustfit and original QR/backslash on 36 fresh multipredictor cases
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207'); run_original_v207
      - name: Preserve immutable original source-output integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Retain original numerical evidence and rejected-CPU preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v207-raw-multi-qr-and-robustfit
          path: |
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207/original.json
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_multi_v207/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
