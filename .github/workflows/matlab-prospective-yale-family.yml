name: Genuine MATLAB R2026b | Yale family fold original-source integers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-yale-family-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify prospective synthetic family case source seals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('Cingulum_Yale_MATLAB_Online/yale_family_prospective')
          m=json.loads((root/'manifest.json').read_text())
          assert m['source_yale_commit']=='b903f83b476b745417b1f062f6777f5ffe118f1a'
          assert m['expected_mathworks_release']=='R2026b'
          assert m['patient_data_included'] is False
          assert m['test_exact_fold_labels'] and m['test_exact_unassigned_indices']
          assert m['reference_only_not_production_cv']
          assert m['original_matlab_rng_not_claimed_reproduced']
          assert m['original_matlab_permutation_injected_after_execution']
          assert m['independent_rust_algorithm_pre_registered']
          assert len(m['cases'])==20
          for name,item in m['cases'].items():
              for filename,digest in item['sha256'].items():
                  file=root/name/filename
                  assert file.is_file() and hashlib.sha256(file.read_bytes()).hexdigest()==digest
              case=json.loads((root/name/'input.json').read_text())
              assert case['subjects']==item['subjects']
              assert case['k']==item['k']
              assert len(case['family_ids'])==item['subjects']
          print('20_FROZEN_SYNTHETIC_YALE_FAMILY_SOURCE_CASES_SHA256_PASS')
          PY

      - name: Checkout immutable original Yale MATLAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Cingulum_Yale_MATLAB_Online/upstream
          git clone --quiet https://github.com/YaleMRRC/CPM.git Cingulum_Yale_MATLAB_Online/upstream/yale-cpm
          git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm checkout --quiet --detach b903f83b476b745417b1f062f6777f5ffe118f1a
          test "$(git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm rev-parse HEAD)" = b903f83b476b745417b1f062f6777f5ffe118f1a

      - name: Run genuine MathWorks MATLAB R2026b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox

      - name: Produce untouched original Yale seeded family fold outputs
        uses: matlab-actions/run-command@v3
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online');
            run_yale_family_prospective;

      - name: Retain original Yale results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-matlab-original-yale-family-folds
          path: Cingulum_Yale_MATLAB_Online/yale_family_results/*.json
          if-no-files-found: warn
          retention-days: 90
