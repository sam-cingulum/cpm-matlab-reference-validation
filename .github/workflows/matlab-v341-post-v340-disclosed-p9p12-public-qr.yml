name: Genuine MATLAB V341 source-disclosed post-V340 p9 p12 pivoted QR diagnostics
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source-disclosed post-V340 original V338 input
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v338_new_firstblind_p9p12
          echo "6ac321c1de1c034db55edebf2aa4073174fa3436b810855e6a2297ee372cfb41  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          d=json.load(open('Cingulum_Yale_MATLAB_Online/multix_v338_new_firstblind_p9p12/input.json'))
          assert d['classification']=='V338_NEW_GENUINE_ORIGINAL_FIRST_BLIND_P9P12_FULL_MLDIVIDE'
          assert d['seed']==202611220338 and d['cohorts']==32 and len(d['cases'])==32
          assert d['historical_V308']=='IMMUTABLE_FAIL_54741_OF_57816'
          assert d['historical_V332']=='PASS_261120_OF_261120'
          assert d['historical_V336']=='PASS_261120_OF_261120'
          assert d['universal_V12']=='SEALED'
          assert set(c['p'] for c in d['cases'])=={9,10,11,12}
          print('V341 source-disclosed post-V340 original-only public QR diagnostic admitted')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr/original_cpu.txt
      - name: Execute genuine original MATLAB V341 public pivoted QR twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr'); run_original_v341
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v341-post-v340-disclosed-public-qr-p9p12
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr/original.json
            Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v341_post_v340_disclosed_p9p12_public_qr/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
