name: "Genuine MathWorks R2026b | disclosed V11 complete inference and tcdf probe"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-disclosed-v11-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify old disclosed input and real supported AMD CPU before MATLAB
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_robustfit_end_to_end_source_unseen_480_v11
          q=Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe
          test "$(sha256sum "$p/input.json" | cut -d' ' -f1)" = 1144418910dc6a81ba3b98f9540fe914ac796d9a9bab25ce75f6c1ef2ace2f53
          { echo "Run=$GITHUB_RUN_ID"; echo "Commit=$GITHUB_SHA"; lscpu; uname -a; } > "$q/cpu_and_vendor_fingerprint.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Verified original MATLAB CPU=$model"
          printf '%s' "$model" | grep -Eq '^AMD EPYC .*(9V74|9V45|7763)' || { echo 'CPU profile unsupported' >&2; exit 86; }
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Audit original vendor binary hashes
        shell: bash
        run: |
          set -euo pipefail
          q=Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe
          for n in MATLAB libmwlapack.so mkl.so; do f=$(find /opt/hostedtoolcache/MATLAB -name "$n" -type f -print -quit); if [ -n "$f" ]; then sha256sum "$f" >> "$q/cpu_and_vendor_fingerprint.txt"; fi; done
          sha256sum "$q/run_original_v11_disclosed_inference.m" >> "$q/cpu_and_vendor_fingerprint.txt"
      - name: Original unchanged robustfit twice and genuine tcdf/betainc
        uses: matlab-actions/run-command@v3
        env:
          V11_DISCLOSED_INFERENCE_OUTPUT: original_v11_480_disclosed_inference.json
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe');
            run_original_v11_disclosed_inference;
      - name: SHA original artifacts
        shell: bash
        run: |
          set -euo pipefail
          q=Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe
          sha256sum "$q/original_v11_480_disclosed_inference.json" "$q/cpu_and_vendor_fingerprint.txt" > "$q/original_sha256_manifest.txt"
          python3 "$q/verify_original_v11_disclosed_inference.py" "$q/original_v11_480_disclosed_inference.json"
      - name: Preserve genuine disclosed original stats and vendor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-matlab-r2026b-v11-disclosed-inference-480
          path: |
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe/original_v11_480_disclosed_inference.json
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe/cpu_and_vendor_fingerprint.txt
            Cingulum_Yale_MATLAB_Online/matlab_robustfit_v11_disclosed_inference_probe/original_sha256_manifest.txt
          retention-days: 90
          if-no-files-found: warn
