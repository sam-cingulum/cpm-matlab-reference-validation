name: MATLAB R2026b V916 n65 block8 cross prospective firstblind
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen prospective source and original-only runner
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout
          echo "3491a80422f606ea4edf28f770f8e58526701558855067912a1d89a1dc43399c  $dst/input.json" | sha256sum -c -
          echo "b950fe08f3131dc27432ff58d1e500a0ab4e1ce3a4f0e43ae0e882f4c70740e8  $dst/run_original_v916.m" | sha256sum -c -
          python3 - <<'PY'
          import json
          path = 'Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout/input.json'
          source = json.load(open(path))
          assert source['classification'] == 'V916_N65_CROSS_HOLDOUT_SOURCE_ONLY'
          assert source['source_only'] and source['V12'] == 'SEALED'
          assert source['seed'] == 2026112491607
          assert not source['original_MATLAB_numerical_outputs_read']
          assert not source['independent_Rust_outputs_read']
          assert len(source['matrices']) == 16 and len(source['cases']) == 80
          assert source['widths'] == [1,2,11,12,13,23,24,25]
          PY
      - name: Reject unapproved host before any MATLAB calculations
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout
          { echo "Original GitHub Run=$GITHUB_RUN_ID"; echo "Public original source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$dst/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V916 original-firstblind CPU rejected: $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify genuine MathWorks numerical library
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$dst/original_cpu.txt"
      - name: Execute original MATLAB numerical solver twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout'); run_original_v916
      - name: Verify original repetitions and evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          dst=Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout
          python3 - <<'PY'
          import json
          path = 'Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout/original_v916.json'
          original = json.load(open(path))
          assert original['classification'] == 'V916_ORIGINAL_MATLAB_R2026B_N65_BLOCK8_HOLDOUT_FIRSTBLIND'
          assert original['V12'] == 'SEALED' and original['source_unseen_original_firstblind']
          assert not original['original_source_reads_Rust_values']
          assert 'R2026b) Update 1' in original['release']
          assert original['mkl_cbwr'] == 'COMPATIBLE' and original['repetitions'] == 2
          assert original['input_SHA256'] == '3491a80422f606ea4edf28f770f8e58526701558855067912a1d89a1dc43399c'
          rows = original['rows']
          assert len(rows) == 128
          for first, second in zip(rows[:64], rows[64:], strict=True):
              assert first['rep'] == 1 and second['rep'] == 2
              assert {k:v for k,v in first.items() if k != 'rep'} == {k:v for k,v in second.items() if k != 'rep'}
          for row in rows:
              assert row['n'] == 65 and row['p'] in (10,11) and row['z'] in (0,1,2,7)
              assert len(row['probes']) == 5
              for probe in row['probes']:
                  assert len(probe['layouts']) == 2
                  for layout in probe['layouts']:
                      assert [panel['w'] for panel in layout['panels']] == original['widths']
                      assert all(len(panel['columns']) == panel['w'] for panel in layout['panels'])
          print('V916 original-only double repetition validated')
          PY
          sha256sum "$dst/original_v916.json" "$dst/original_cpu.txt" > "$dst/original_sha256_manifest.txt"
      - name: Preserve original output and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v916-n65-cross-firstblind
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout/original_v916.json
            Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v916_firstblind_n65_block8_holdout/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
