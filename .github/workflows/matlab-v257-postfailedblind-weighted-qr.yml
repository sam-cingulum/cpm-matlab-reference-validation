name: Genuine MATLAB V257 SOURCE-DISCLOSED V257 terminal-outlier weighted QR arithmetic after unchanged V252 first FAIL
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-unchanged-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify preregistered input and frozen Rust preoracle reference
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original
          echo "48e7517b8cb6cc211193c9466707b98bd484b8af349f7276c4e9960ae86f6e79  $p/input.json" | sha256sum -c -
          echo "V257 source-DISCLOSED retrospective reference; no first-blind claim"
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original/input.json'
          d=json.load(open(p))
          assert d['schema']=='CINGULUM_V252_R2026B_FULL_17_MULTIX_FIRST_ORIGINAL_BLIND'
          assert d['seed']==202611220252 and len(d['cases'])==48
          assert len({a['id'] for a in d['cases']})==48
          assert Counter(a['n'] for a in d['cases'])=={35:16,61:16,87:16}
          assert all(len(a['x_colmajor_hex'])==a['n']*a['p'] and len(a['y_hex'])==a['n'] for a in d['cases'])
          print('V257 immutable previously-disclosed raw X/y input')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Runner real CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "UNAPPROVED SOURCE CPU: original MATLAB not executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Exact genuine MathWorks R2026b mathspec runtime fingerprint
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original/original_cpu.txt
      - name: Capture genuine original MATLAB public weighted QR and backslash at every terminal-outlier IRLS stage
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original'); run_original_v257
      - name: Preserve immutable original source-output integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Retain original numerical evidence and rejected-CPU preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v257-postfailed-weighted-qr-12
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original/original.json
            Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v257_weighted_original/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
