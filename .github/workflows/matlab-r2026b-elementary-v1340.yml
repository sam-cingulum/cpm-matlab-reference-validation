name: MATLAB R2026b V1340 original-only elementary-function probe (source-disclosed diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cbwr: COMPATIBLE
          - os: ubuntu-22.04
            cbwr: DEFAULT
          - os: ubuntu-24.04
            cbwr: COMPATIBLE
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set the CBWR mode under test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cbwr }}" != "DEFAULT" ]; then echo "MKL_CBWR=${{ matrix.cbwr }}" >> "$GITHUB_ENV"; fi
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/elementary_v1340
          mkdir -p "$d/out"
          { echo "Genuine original GitHub run=$GITHUB_RUN_ID"; echo "Public source commit=$GITHUB_SHA"; echo "Job OS=${{ matrix.os }}"; echo "CBWR=${{ matrix.cbwr }}"; lscpu; uname -a; ldd --version | head -1; } > "$d/out/original_cpu.txt"
          sha256sum "$d/run_v1340.m" >> "$d/out/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V1340 probe rejected unapproved CPU $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Record genuine MathWorks mathspec binary SHA and which libraries export arctangent symbols
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/elementary_v1340
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/out/original_cpu.txt"
          bin="$(dirname "$file")"
          {
            echo "MATLAB bin directory: $bin"
            for f in "$bin"/*.so*; do
              syms="$(nm -D --defined-only "$f" 2>/dev/null | grep -Ei ' (atan|__atan|__ieee754_atan2|.*fdlibm.*|.*_atan|atan[a-z0-9_]*)$' | head -20 || true)"
              if [ -n "$syms" ]; then echo "== $(basename "$f")"; echo "$syms"; fi
            done
            echo "== MATLAB libraries that need libm:"
            for f in "$bin"/libmwmathspec.so "$bin"/libmwmathutil.so "$bin"/libmwmathelem.so; do [ -f "$f" ] && { echo "-- $(basename "$f")"; readelf -d "$f" | grep NEEDED || true; }; done
          } > "$d/out/atan_symbols.txt" 2>&1 || true
          head -c 20000 "$d/out/atan_symbols.txt"
      - name: Run the original-only elementary-function probe
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/elementary_v1340'); run_v1340
      - name: Manifest
        if: always()
        shell: bash
        run: |
          cd Cingulum_Yale_MATLAB_Online/elementary_v1340/out
          cat log.txt || true
          sha256sum * > ../out_sha256_manifest.txt || true
          mv ../out_sha256_manifest.txt .
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1340-elementary-${{ matrix.os }}-${{ matrix.cbwr }}
          path: Cingulum_Yale_MATLAB_Online/elementary_v1340/out
          if-no-files-found: warn
          retention-days: 90
