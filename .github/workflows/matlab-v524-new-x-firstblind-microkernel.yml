name: MATLAB R2026b V524 unseen-X RHS microkernel original
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Freeze new X source and original-only MATLAB runner
        shell: bash
        run: |
          set -euo pipefail
          source=Cingulum_Yale_MATLAB_Online/multix_v523_unseen_n48_n65_rhs_microkernel/input.json
          runner=Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original/run_original_v524.m
          echo "9aa8174362012a04b9d4c2ea1f6b4320ee2dc04271f7852a2c2c165e1f934bd1  $source" | sha256sum -c -
          echo "3edd7c27a3a1e9dda03a96db429e99c3dea0ab6243765570449ffa1b7f632d62  $runner" | sha256sum -c -
          python3 - <<'PY'
          import json
          path="Cingulum_Yale_MATLAB_Online/multix_v523_unseen_n48_n65_rhs_microkernel/input.json"
          data=json.load(open(path))
          assert data["classification"]=="V523_NEW_X_SOURCE_UNSEEN_R2026B_QR_RHS_MICROKERNEL_INPUT"
          assert data["V12"]=="SEALED" and data["NOT_new_firstblind"]
          assert data["source_only"] and not data["original_MATLAB_numerical_outputs_read"]
          assert not data["independent_Rust_outputs_read"] and not data["source_original_only_reads_Rust_values"]
          assert len(data["cases"])==data["case_count"]==96
          assert len(data["matrices"])==data["matrix_count"]==8
          assert len({m["id"] for m in data["matrices"]})==8
          assert data["rhs_variants"]==["unmodified","interior_reverse","alternating_sign"]
          assert data["layouts"]==["repeated","signed_power2"]
          assert data["widths"]==[1,2,11,12,13,23,24]
          assert data["padding_n48"]==[0,2,3,7] and data["padding_n65"]==[0,1,2,7]
          assert data["original_repetitions"]==2
          print("V524 SHA-frozen, source-only prospective new-X contract PASS")
          PY
      - name: Require approved AMD before MATLAB installation
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original
          { echo "Run=$GITHUB_RUN_ID"; echo "Source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$d/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "V524 original-only blocked: unapproved CPU $model" >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Check pinned MathWorks original library
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> "$d/original_cpu.txt"
      - name: Repeat genuine original MATLAB twice independently
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original'); run_original_v524
      - name: Verify result structure, repeat coverage and original hashes
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original
          test -s "$d/original.json"
          python3 - <<'PY'
          import json
          path="Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original/original.json"
          out=json.load(open(path))
          assert out["classification"]=="V524_R2026B_PROSPECTIVE_NEW_X_ORIGINAL_FIRSTBLIND_MICROKERNEL"
          assert out["V12"]=="SEALED" and out["NOT_new_firstblind"]
          assert out["new_X_original_firstblind_diagnostic"]
          assert not out["source_original_only_reads_Rust_values"]
          assert out["input_sha256"]=="9aa8174362012a04b9d4c2ea1f6b4320ee2dc04271f7852a2c2c165e1f934bd1"
          assert "R2026b) Update 1" in out["release"] and out["mkl_cbwr"]=="COMPATIBLE"
          assert out["case_count"]==96 and out["repetitions"]==2
          assert out["variants"]==["unmodified","interior_reverse","alternating_sign"]
          assert out["layouts"]==["repeated","signed_power2"]
          assert out["widths"]==[1,2,11,12,13,23,24]
          assert len(out["rows"])==1152
          assert sum(row["rep"]==1 for row in out["rows"])==576
          assert sum(row["rep"]==2 for row in out["rows"])==576
          assert all(len(row["pads"])==4 for row in out["rows"])
          print("V524 approved original MATLAB two-repetition shape PASS")
          PY
          source=Cingulum_Yale_MATLAB_Online/multix_v523_unseen_n48_n65_rhs_microkernel/input.json
          runner=$d/run_original_v524.m
          sha256sum "$source" "$runner" "$d/original.json" "$d/original_cpu.txt" > "$d/original_sha256_manifest.txt"
          sha256sum -c "$d/original_sha256_manifest.txt"
      - name: Preserve result or rejected CPU provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-matlab-v524-new-x-firstblind
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original/original.json
            Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v524_firstblind_new_x_original/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
