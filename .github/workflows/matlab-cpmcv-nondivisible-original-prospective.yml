name: Genuine MATLAB R2026b | Yale cpm_cv nondivisible-fold source behavior
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpmcv-remainder:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Verify six precommitted original-source synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path("Cingulum_Yale_MATLAB_Online/cpm_cv_remainder_prospective")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["experiment_id"]=="yale-cpmcv-remainder-original-source-20261111-v1"
          assert manifest["pinned_source"]=="b903f83b476b745417b1f062f6777f5ffe118f1a"
          assert manifest["matlab_release"]=="R2026b" and manifest["acceptance_abs"]=="1e-9"
          assert manifest["predeclared_expected_remainders"]==[1,3,0,0,1,1]
          assert manifest["bitwise_zero_unassigned"] and manifest["original_fitting_not_yet_executed"]
          assert not manifest["patient_data"] and len(manifest["cases"])==6
          for name,spec in manifest["cases"].items():
              for filename,digest in spec["sha256"].items():
                  file=root/name/filename
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==digest,(name,filename)
          print("ORIGINAL_CPMCV_PREDECLARED_SYNTHETIC_FIXTURE_SHA256_PASS")
          print("MANIFEST_SHA256",hashlib.sha256((root/"manifest.json").read_bytes()).hexdigest())
          PY
      - name: Checkout exactly pinned, unchanged Yale CPM source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Cingulum_Yale_MATLAB_Online/upstream
          git clone --quiet https://github.com/YaleMRRC/CPM.git Cingulum_Yale_MATLAB_Online/upstream/yale-cpm
          git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm checkout --quiet --detach b903f83b476b745417b1f062f6777f5ffe118f1a
          test "$(git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm rev-parse HEAD)" = b903f83b476b745417b1f062f6777f5ffe118f1a
      - name: Install genuine MathWorks MATLAB R2026b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Execute original cpm_cv source plus exact-fold reconstruction
        uses: matlab-actions/run-command@v3
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online');
            run_cpm_cv_remainder_original_prospective;
      - name: Archive source artifacts on pass OR failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-yale-cpmcv-nondivisible-original-20261111
          path: Cingulum_Yale_MATLAB_Online/cpm_cv_remainder_results/*.json
          if-no-files-found: warn
          retention-days: 90
