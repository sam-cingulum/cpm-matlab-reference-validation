name: "Genuine MATLAB R2026b | Hidden gammaln numerical region V6"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sha-pinned-gamma-region:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent structural metadata probe
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          python3 -m py_compile "$p/inspect_hidden_gamma_region_v6.py"
          sha256sum "$p/inspect_hidden_gamma_region_v6.py"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Summarize installed gamma mathematical region without vendor code
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find /opt/hostedtoolcache/MATLAB -type f -path '*/bin/glnxa64/libmwmathspec.so' -print -quit)
          test -n "$lib"
          root="${lib%/bin/glnxa64/libmwmathspec.so}"
          p=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          python3 "$p/inspect_hidden_gamma_region_v6.py" "$root" "$p/hidden_gamma_region_v6.json"
          sha256sum "$p/hidden_gamma_region_v6.json" > "$p/hidden_gamma_region_v6.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-R2026b-hidden-gamma-region-metadata-only-v6
          path: |
            Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2/hidden_gamma_region_v6.json
            Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2/hidden_gamma_region_v6.sha256
          retention-days: 90
          if-no-files-found: error
