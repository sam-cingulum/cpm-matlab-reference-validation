name: Genuine MATLAB V377 source-disclosed p9-12 second-reflector sparse RHS impulses
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-disclosed V377 sparse-impulse original-only inputs
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses
          echo "ef95b3a983d15454b6ca0e4625893039cc896b77fe792a2108166543301c1556  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          d=json.load(open('Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/input.json'))
          assert d['classification']=='V377_POST_V371_SOURCE_DISCLOSED_ORIGINAL_ONLY_TWO_REFLECTOR_SPARSE_IMPULSES'
          assert d['source_disclosed_after_V371'] is True and d['original_MATLAB_numerical_results_consulted'] is False
          assert d['original_source_reads_independent_Rust_forecast'] is False
          assert d['V371_first_original_blind']=='IMMUTABLE_FAIL_133582_OF_182784'
          assert d['V366_first_original_blind']=='PASS_365568_OF_365568' and d['V12']=='SEALED'
          assert d['case_count']==8 and len(d['cases'])==8
          assert d['widths']==[1,2,4,8,11,12,13,16] and d['padding']==[0,1,7,16]
          assert all(c['p'] in [9,10,11,12] and c['n'] in [48,65] for c in d['cases'])
          assert all(len(c['a_colmajor_hex'])==c['p']*c['n'] and len(c['b16_colmajor_hex'])==16*c['n'] for c in d['cases'])
          print('V377 original-only sparse two-reflector source valid')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/original_cpu.txt
      - name: Execute genuine original MATLAB V377 full mldivide and public QTB twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses'); run_original_v377
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v377-disclosed-two-reflector-impulses-8
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/original.json
            Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
