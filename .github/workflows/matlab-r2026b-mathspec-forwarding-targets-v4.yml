name: "Genuine MATLAB R2026b | Installed mathspec wrapper forwarding targets V4"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch-target-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent metadata-only tooling
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          python3 -m py_compile "$p/inspect_mathspec_math_function_references_v4.py"
          sha256sum "$p/inspect_mathspec_math_function_references_v4.py"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Extract branch-target and public math symbol metadata (no proprietary implementation bytes)
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find /opt/hostedtoolcache/MATLAB -type f -path '*/bin/glnxa64/libmwmathspec.so' -print -quit)
          test -n "$lib"
          root="${lib%/bin/glnxa64/libmwmathspec.so}"
          p=Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2
          python3 "$p/inspect_mathspec_math_function_references_v4.py" "$root" "$p/mathspec_forwarding_targets_v4.json"
          sha256sum "$p/mathspec_forwarding_targets_v4.json" > "$p/mathspec_forwarding_targets_v4.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-R2026b-mathspec-forwarding-targets-metadata-only-v4
          path: |
            Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2/mathspec_forwarding_targets_v4.json
            Cingulum_Yale_MATLAB_Online/matlab_r2026b_special_function_native_metadata_v2/mathspec_forwarding_targets_v4.sha256
          retention-days: 90
          if-no-files-found: error
