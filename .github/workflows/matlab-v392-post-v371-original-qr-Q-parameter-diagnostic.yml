name: Genuine MATLAB V392 post-V371 original-only explicit Q packed Householder parameter diagnostic
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-only MATLAB diagnostic and immutable prior V377 input
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability
          echo "e7951e87c8286791613fe64e261a2cad2228c9fd39ed478b7d1add81b1401de5  $p/run_original_v392.m" | sha256sum -c -
          echo "ef95b3a983d15454b6ca0e4625893039cc896b77fe792a2108166543301c1556  Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          d=json.load(open('Cingulum_Yale_MATLAB_Online/multix_v377_post_v371_two_reflector_sparse_impulses/input.json'))
          assert d['classification']=='V377_POST_V371_SOURCE_DISCLOSED_ORIGINAL_ONLY_TWO_REFLECTOR_SPARSE_IMPULSES'
          assert d['source_disclosed_after_V371'] is True
          assert d['original_MATLAB_numerical_results_consulted'] is False
          assert d['original_source_reads_independent_Rust_forecast'] is False
          assert d['V371_first_original_blind']=='IMMUTABLE_FAIL_133582_OF_182784'
          assert d['V366_first_original_blind']=='PASS_365568_OF_365568' and d['V12']=='SEALED'
          assert d['case_count']==8 and len(d['cases'])==8
          print('Genuine original-only V392 public Q diagnostic input/source sealed')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability/original_cpu.txt
      - name: Execute genuine original MATLAB V392 explicit Q and both solver pathways twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability'); run_original_v392
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v392-public-Q-parameter-diagnostic-8
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability/original.json
            Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v392_post_v371_source_disclosed_qr_householder_parameter_identifiability/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
