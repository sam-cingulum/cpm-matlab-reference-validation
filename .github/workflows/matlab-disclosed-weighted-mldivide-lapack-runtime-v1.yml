name: "Genuine R2026b | Disclosed V9 weighted mldivide LAPACK runtime audit"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  disclosed-six-weighted-mldivide:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check disclosed original numerical inputs and compile passive observers
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1
          test "$(sha256sum "$p/inputs_v9_6_revealed.json" | cut -d' ' -f1)" = adbd85b67c2618d4befa2ec2d613b14a66c071bee7ef3ef093ac3632ec9f0248
          gcc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC "$p/weighted_lapack_call_counter.c" -o "$p/weighted_lapack_call_counter.so" -ldl
          gcc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC "$p/weighted_lapack_binding_audit.c" -o "$p/weighted_lapack_binding_audit.so"
          sha256sum "$p"/*.c "$p"/*.so > "$p/native_probe_build_sha256.txt"
          echo 'ORIGINAL_SOURCE_DISCLOSED_ONLY: Six AMD V9 original weights have already been observed.'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Original genuine MATLAB runtime CPU and MKL fingerprint
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1
          { echo "run=$GITHUB_RUN_ID";echo "commit=$GITHUB_SHA";lscpu;uname -a;for n in MATLAB libmwlapack.so mkl.so;do f=$(find /opt/hostedtoolcache/MATLAB -name "$n" -type f -print -quit);if [ -n "$f" ];then sha256sum "$f";fi;done; } > "$p/mldivide_runtime_cpu_and_vendor.txt"
      - name: A Original unchanged source weighted mldivide CONTROL
        uses: matlab-actions/run-command@v3
        env:
          WEIGHTED_LSQ_PROBE_OUTPUT: mldivide_six_control.json
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1');
            run_weighted_mldivide_six_disclosed_only;
      - name: B Original unchanged MATLAB weighted mldivide under pass-through LAPACK call counters
        uses: matlab-actions/run-command@v3
        env:
          WEIGHTED_LSQ_PROBE_OUTPUT: mldivide_six_interposed.json
          LD_PRELOAD: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/weighted_lapack_call_counter.so
          WLS_LAPACK_TRACE_LOG: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_native_lapack_calls.log
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1');
            run_weighted_mldivide_six_disclosed_only;
      - name: C Original unchanged MATLAB under passive ELF symbol audit
        uses: matlab-actions/run-command@v3
        env:
          WEIGHTED_LSQ_PROBE_OUTPUT: mldivide_six_audit.json
          LD_AUDIT: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/weighted_lapack_binding_audit.so
          WLS_BIND_AUDIT_LOG: ${{ github.workspace }}/Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_native_binding_audit.log
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1');
            run_weighted_mldivide_six_disclosed_only;
      - name: Strict exact numerical noninterference on all instrumented results
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1
          cmp "$p/mldivide_six_control.json" "$p/mldivide_six_interposed.json"
          cmp "$p/mldivide_six_control.json" "$p/mldivide_six_audit.json"
          grep -q 'WLS_LAPACK_CALL' "$p/mldivide_native_lapack_calls.log"
          python3 - <<'PY'
          import json
          p='Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_six_control.json'
          j=json.load(open(p))
          assert len(j['records'])==6 and j['source_unseen'] is False
          assert all(r['repeat_binary64_identical'] for r in j['records'])
          print('SIX ORIGINAL MATLAB DISCLOSED WEIGHTED BACKSLASH BIN64 NONINTERFERENCE PASS')
          PY
      - name: Archive unchanged genuine source controls and synthetic-only LAPACK audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-matlab-r2026b-disclosed-weighted-mldivide-lapack-boundary
          path: |
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_six_control.json
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_six_interposed.json
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_six_audit.json
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_native_lapack_calls.log
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_native_binding_audit.log
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/mldivide_runtime_cpu_and_vendor.txt
            Cingulum_Yale_MATLAB_Online/weighted_mldivide_revealed_v1/native_probe_build_sha256.txt
          retention-days: 90
          if-no-files-found: warn
