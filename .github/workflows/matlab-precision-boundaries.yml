name: Genuine MATLAB R2026b | near-lasso exact coefficient boundary probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coefficient-precision-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable synthetic stress source hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('Cingulum_Yale_MATLAB_Online/stress')
          m=json.loads((root/'manifest.json').read_text())
          assert m['patient_data_included'] is False and len(m['scenarios']) == 7
          assert m['source_commit']['yale-cpm'] == 'b903f83b476b745417b1f062f6777f5ffe118f1a'
          for name,meta in m['scenarios'].items():
              for fn,digest in meta['sha256'].items():
                  assert hashlib.sha256((root/name/fn).read_bytes()).hexdigest()==digest,(name,fn)
          print('PASS: pinned, synthetic-only immutable stress inputs')
          PY
      - name: Fetch pinned, unchanged Yale MATLAB source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Cingulum_Yale_MATLAB_Online/upstream
          git clone --quiet https://github.com/YaleMRRC/CPM.git Cingulum_Yale_MATLAB_Online/upstream/yale-cpm
          git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm checkout --quiet --detach b903f83b476b745417b1f062f6777f5ffe118f1a
          test "$(git -C Cingulum_Yale_MATLAB_Online/upstream/yale-cpm rev-parse HEAD)" = b903f83b476b745417b1f062f6777f5ffe118f1a
      - name: Install genuine MATLAB R2026b and Statistics Toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Probe two coefficient boundary folds
        uses: matlab-actions/run-command@v3
        with:
          command: |
            cd('Cingulum_Yale_MATLAB_Online');
            probe_precision_boundaries;
      - name: Archive authentic source coefficients
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-r2026b-near-lasso-precision-boundaries
          path: Cingulum_Yale_MATLAB_Online/results/precision_boundaries/precision_boundaries.json
          if-no-files-found: warn
          retention-days: 90
