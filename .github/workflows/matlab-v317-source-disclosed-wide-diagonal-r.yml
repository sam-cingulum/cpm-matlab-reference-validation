name: Genuine MATLAB V317 source-disclosed wide p7 p8 diagonal-R one-reflector test
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source-disclosed V317 diagonal-R synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original
          echo "23837b3f3d9ac834481499d8985fccfb41a0eff15c47fa0e54006cabebd0c118  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original/input.json'
          d=json.load(open(p))
          assert d['classification']=='V317_SOURCE_DISCLOSED_WIDE_P7P8_DIAGONAL_R_SINGLE_ACTIVE_REFLECTOR_ORIGINAL'
          assert d['source_disclosed_after_V308'] is True
          assert d['source_original_MATLAB_numerical_data_consulted'] is False
          assert d['original_first_blind_V308']=='IMMUTABLE_FAIL_54741_OF_57816'
          assert d['V284_solo_original_first_blind']=='PASS_1770_OF_1770'
          assert d['V12']=='SEALED'
          assert d['seed']==202611220317
          assert d['case_count']==48 and len(d['cases'])==48
          assert d['widths']==[1,2,3,4,5,6,7,8,9,12,16]
          assert d['padding']==[0,1,7]
          assert set(c['p'] for c in d['cases'])=={7,8}
          assert len(set(c['id'] for c in d['cases']))==48
          assert all(len(c['a_colmajor_hex'])==c['n']*c['p'] and len(c['b16_colmajor_hex'])==16*c['n'] for c in d['cases'])
          print('V317 original source-only diagonal-R wide predictor experiment admitted')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original/original_cpu.txt
      - name: Execute genuine original MATLAB V317 wide diagonal-R multirhs twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original'); run_original_v317
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v317-disclosed-diagonal-r-wide-48
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original/original.json
            Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v317_disclosed_diagonal_r_wide_original/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
