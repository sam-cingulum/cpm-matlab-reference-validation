name: R2026b complete robustfit at every sample size 129 through 1025 V134
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  numeric-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/robustfit_range_v134
    steps:
      - uses: actions/checkout@v4
      - run: |
          sha256sum -c input.sha256
          lscpu > cpu.txt
          head -n 20 cpu.txt
          grep -E '^Model name: *AMD EPYC .*(7763|9V45)' cpu.txt
      - name: Regenerate exact synthetic inputs
        run: |
          python3 generate.py . > generated.sha256
          cmp manifest.sha256 generated.sha256
          sha256sum -c manifest.sha256
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - run: |
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/robustfit_range_v134'); run_range
      - run: gzip -n original_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: robustfit-range-v134
          path: |
            Cingulum_Yale_MATLAB_Online/robustfit_range_v134/original_*.json.gz
            Cingulum_Yale_MATLAB_Online/robustfit_range_v134/cpu.txt
          if-no-files-found: error
