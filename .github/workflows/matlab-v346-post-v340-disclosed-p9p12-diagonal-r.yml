name: Genuine MATLAB V346 post-V340 p9-p12 controlled diagonal-R one-reflector
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-original-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable source-disclosed post-V340 diagonal-R p9-12 input
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r
          echo "75560b79e18c770ee24c6676abfe0de3c2f1460d2a4c30940deac075508b4abc  $p/input.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r/input.json'))
          assert d['classification']=='V346_POST_V340_DISCLOSED_P9P12_DIAGONAL_R_SINGLE_ACTIVE_REFLECTOR_ORIGINAL'
          assert d['source_disclosed_after_V340'] is True
          assert d['source_original_MATLAB_numerical_data_consulted'] is False
          assert d['original_first_blind_V308']=='IMMUTABLE_FAIL_54741_OF_57816'
          assert d['V340_original_first_blind']=='IMMUTABLE_FAIL_63871_OF_182784'
          assert d['V332_original_first_blind']=='PASS_261120_OF_261120'
          assert d['V336_original_first_blind']=='PASS_261120_OF_261120'
          assert d['V12']=='SEALED'
          assert d['seed']==202611230346 and d['case_count']==32 and len(d['cases'])==32
          assert d['widths']==list(range(1,17)) and d['padding']==[0,1,7,16]
          assert Counter(c['p'] for c in d['cases'])=={9:8,10:8,11:8,12:8}
          assert len(set(c['id'] for c in d['cases']))==32
          assert all(len(c['a_colmajor_hex'])==c['n']*c['p'] and len(c['b16_colmajor_hex'])==16*c['n'] for c in d['cases'])
          print('V346 source-disclosed controlled diagonal-R genuine original input admitted')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Original runner CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "Unapproved CPU; original MATLAB is NOT executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Verify original genuine MATLAB R2026b mathspec SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r/original_cpu.txt
      - name: Execute genuine original MATLAB V346 diagonal-R full A backslash B twice
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r'); run_original_v346
      - name: Preserve original-only SHA custody and CPU provenance
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r
          test -s "$p/original.json"
          sha256sum "$p/original.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Publish original-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v346-post-v340-disclosed-p9p12-diagonal-r-32
          path: |
            Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r/original.json
            Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/multix_v346_post_v340_disclosed_p9p12_diagonal_r/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
