name: R2026b beta log switch boundaries V36
on: workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Cingulum_Yale_MATLAB_Online/beta_log_switch_v36
    steps:
      - uses: actions/checkout@v4
      - run: |
          sha256sum -c inputs.sha256
          lscpu > cpu.txt
          grep -E '^Model name: *AMD EPYC .*(7763|9V45|9V74)' cpu.txt
          g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -fno-fast-math ../beta_log_arguments_v34/invoke.cpp -o /tmp/v36-invoke -ldl
          if ! command -v gdb; then sudo apt-get update -qq && sudo apt-get install -y -qq gdb; fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - run: |
          set -eu
          lib=$(find /opt/hostedtoolcache/MATLAB -path '*/bin/glnxa64/libmwmathspec.so' -type f -print -quit)
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $lib" | sha256sum -c -
          symbol=$(nm -D --defined-only "$lib" | awk '$3 ~ /^_ZN8mathspec7betaincEddd/ {print $3}')
          test -n "$symbol"
          export LD_LIBRARY_PATH="$(dirname "$lib"):${LD_LIBRARY_PATH:-}"
          timeout 1200 gdb -nx --batch -q -x observe.gdb.py --args /tmp/v36-invoke "$lib" "$symbol" inputs.tsv >/tmp/v36-private.log 2>&1
          python3 -c 'import json; d=json.load(open("observed.json")); assert len(d["rows"])==60 and any(r["log_argument_labels"] for r in d["rows"])'
      - uses: actions/upload-artifact@v4
        with:
          name: beta-log-switch-v36
          path: |
            Cingulum_Yale_MATLAB_Online/beta_log_switch_v36/observed.json
            Cingulum_Yale_MATLAB_Online/beta_log_switch_v36/cpu.txt
          if-no-files-found: error
