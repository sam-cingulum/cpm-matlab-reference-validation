name: "Genuine MATLAB R2026b | specfun compiled numerical symbol inventory (non-numeric)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  specfun-binary-symbol-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Locate MathWorks compiled special-function binary exports (names only)
        shell: bash
        run: |
          set -euo pipefail
          echo 'CLASSIFICATION=R2026B_NATIVE_FUNCTION_EXPORT_NAMES_ONLY_NOT_SOURCE_UNSEEN_NOT_NUMERICAL_PARITY'
          mroot=$(find /opt/hostedtoolcache/MATLAB -type d -path '*/bin/glnxa64' -print -quit)
          test -n "$mroot"
          echo "NUMERIC_RUNTIME_DIR=$mroot"
          echo 'POTENTIAL_MATH_RUNTIME_LIBRARY_FILENAMES:'
          find "$mroot" -maxdepth 1 -type f \( -iname '*math*.so*' -o -iname '*spec*.so*' -o -iname '*fun*.so*' -o -iname '*builtin*.so*' \) -printf '%f\n' | sort | head -100
          echo 'EXPORTED_MATH_LIBRARY_FUNCTION_SYMBOL_NAMES:'
          count=0
          while IFS= read -r -d '' binary; do
            name=$(basename "$binary")
            names=$(timeout 12s nm -D --defined-only "$binary" 2>/dev/null | c++filt | grep -iE 'betainc|gammaln|betaln|incbeta|lgamma|incbet|beta_inc|gamma_ln|statstcdf|[[:space:]]tcdf' | head -30 || true)
            if [ -n "$names" ]; then
              printf 'NATIVE_LIBRARY=%s\n%s\n' "$name" "$names"
              count=$((count+1))
            fi
          done < <(find "$mroot" -maxdepth 1 -type f \( -iname '*math*.so*' -o -iname '*spec*.so*' -o -iname '*fun*.so*' -o -iname '*builtin*.so*' \) -print0)
          echo "MATH_LIBRARY_EXPORT_MATCH_FILE_COUNT=$count"
          echo 'END_NATIVE_SYMBOL_METADATA_ONLY'
