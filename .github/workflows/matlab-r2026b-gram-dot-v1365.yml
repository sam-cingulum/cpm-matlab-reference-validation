name: MATLAB R2026b V1365 source-disclosed diagnostic (Gram and inner-product order at the lasso scale)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_CBWR: COMPATIBLE
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reject any CPU outside the approved AMD 7763 or 9V45 pool
        shell: bash
        run: |
          set -euo pipefail
          d=Cingulum_Yale_MATLAB_Online/gram_dot_v1365
          mkdir -p "$d/out"
          { echo "run=$GITHUB_RUN_ID commit=$GITHUB_SHA"; lscpu; } > "$d/out/cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)' || { echo "rejected CPU $model" >&2; exit 86; }
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Enforce genuine original MathWorks mathspec binary SHA
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/gram_dot_v1365'); run_v1365
      - name: Log and manifest
        if: always()
        shell: bash
        run: |
          cd Cingulum_Yale_MATLAB_Online/gram_dot_v1365/out
          cat log.txt || true
          sha256sum ../run_v1365.m * > ../sha256_manifest.txt || true
          mv ../sha256_manifest.txt .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1365-gram-dot
          path: Cingulum_Yale_MATLAB_Online/gram_dot_v1365/out
          retention-days: 90
