name: Original MathWorks R2026b V203 source-unseen complete 17-field robustfit
on: workflow_dispatch
permissions:
  contents: read
env:
  MKL_CBWR: COMPATIBLE
  MKL_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
jobs:
  genuine-unchanged-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify preregistered input and frozen Rust preoracle reference
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/robustfit_full_v203
          echo "0b12e8fff4603b2cf3fec14c34dbe7ed517736804e877aacba4b08596433a375  $p/input.json" | sha256sum -c -
          echo "V203 native Rust forecast FROZEN SHA256: 845cdfbff063433d2a81473c12d481c29cf9dcdb0c70aefad8206b5dd5372530"
          python3 - <<'PY'
          import json
          from collections import Counter
          p='Cingulum_Yale_MATLAB_Online/robustfit_full_v203/input.json'
          d=json.load(open(p))
          assert d['schema']=='CINGULUM_MATHWORKS_R2026B_RAW_XY_FULL_ROBUSTFIT_480_V203_SOURCE_UNSEEN'
          assert d['seed']==202611220203 and len(d['cases'])==480
          assert len({a['id'] for a in d['cases']})==480
          assert Counter(a['n'] for a in d['cases'])=={9:80,11:80,15:80,17:80,23:80,25:80}
          assert all(len(a['x_hex'])==len(a['y_hex'])==a['n'] for a in d['cases'])
          print('V203 preregistered input only, no MATLAB numerics accessed')
          PY
      - name: Fail closed unless original CPU is approved AMD EPYC 7763 or 9V45
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/robustfit_full_v203
          { echo "GitHub Actions Run=$GITHUB_RUN_ID"; echo "Public source SHA=$GITHUB_SHA"; lscpu; uname -a; } > "$p/original_cpu.txt"
          model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
          echo "Runner real CPU: $model"
          if ! printf '%s' "$model" | grep -Eq '^AMD EPYC .*(7763|9V45)'; then
            echo "UNAPPROVED SOURCE CPU: original MATLAB not executed." >&2
            exit 86
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Exact genuine MathWorks R2026b mathspec runtime fingerprint
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /opt/hostedtoolcache/MATLAB -name libmwmathspec.so -type f -print -quit)"
          test -n "$file"
          echo "625bc659a790963d52dca039c66bcbde68c319caba37f89b85dd977c6a3be848  $file" | sha256sum -c -
          sha256sum "$file" >> Cingulum_Yale_MATLAB_Online/robustfit_full_v203/original_cpu.txt
      - name: Invoke unchanged original robustfit twice on all frozen V203 cases
        uses: matlab-actions/run-command@v3
        with:
          command: cd('Cingulum_Yale_MATLAB_Online/robustfit_full_v203'); run_original_v203
      - name: Preserve immutable original source-output integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          p=Cingulum_Yale_MATLAB_Online/robustfit_full_v203
          test -s "$p/original_v203.json"
          sha256sum "$p/original_v203.json" "$p/original_cpu.txt" > "$p/original_sha256_manifest.txt"
      - name: Retain original numerical evidence and rejected-CPU preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathworks-original-v203-complete-17-statistics
          path: |
            Cingulum_Yale_MATLAB_Online/robustfit_full_v203/original_v203.json
            Cingulum_Yale_MATLAB_Online/robustfit_full_v203/original_cpu.txt
            Cingulum_Yale_MATLAB_Online/robustfit_full_v203/original_sha256_manifest.txt
          if-no-files-found: warn
          retention-days: 90
